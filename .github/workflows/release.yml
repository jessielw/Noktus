name: Build release archives

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag and GitHub Release to build for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: macos-15
            label: macOS arm64
          - os: macos-15-intel
            label: macOS x64
          - os: ubuntu-22.04
            label: Linux x64
    runs-on: ${{ matrix.os }}
    env:
      NOKTUS_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run make:archive
      - name: Verify macOS release archive signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          unpack_dir="$(mktemp -d)"
          arch="$(node -p 'process.arch')"
          ditto -x -k out/release/Noktus-*-macos-*.zip "$unpack_dir"
          app="$unpack_dir/Noktus-darwin-$arch/Noktus.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep --fixed-strings --line-regexp 'Signature=adhoc'
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: npm run make:deb
      - name: Verify Debian package layout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_contents="$(mktemp)"
          dpkg-deb --contents out/release/Noktus_*.deb > "$package_contents"
          grep --quiet 'drwxr-xr-x root/root.*opt/Noktus/$' "$package_contents"
          grep --quiet 'rwxr-xr-x root/root.*opt/Noktus/Noktus' "$package_contents"
          grep --quiet 'rwsr-xr-x root/root.*opt/Noktus/chrome-sandbox' "$package_contents"
          grep --quiet 'usr/bin/noktus' "$package_contents"
          grep --quiet 'usr/share/applications/noktus.desktop' "$package_contents"
      - name: Install and launch Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./out/release/Noktus_*.deb
          stat --format='%A %U:%G %n' /opt/Noktus/Noktus /opt/Noktus/chrome-sandbox
          timeout 45s xvfb-run --auto-servernum /usr/bin/noktus --smoke-packaged --smoke-user-data="$(mktemp -d)"
      - name: Keep release archives from failed uploads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noktus-${{ matrix.os }}-release-output
          path: out/release/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Attach archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$NOKTUS_RELEASE_TAG" out/release/* --clobber
